[book]
title = "superui"
authors = ["Timur Sultanaev"]
description = "Browser-like HTML/CSS/JS + Solid-style TSX game UI for Bevy."
src = "src"
language = "en"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/bevy_superui/"
git-repository-url = "https://github.com/strowk/bevy_superui"
additional-css = ["theme/css/site.css", "theme/css/landing.css"]
no-section-label = true

[preprocessor.gallery]
command = "cargo run -q -p mdbook-gallery --"
manifest = "../examples/gallery.json"

# Build-time syntax highlighting via Shiki (real .tsx/JSX grammar), themed to the
# superui palette. Emits <pre class="shiki"> markup; theme/highlight.js neutralizes
# mdBook's client-side highlighter so it doesn't re-process it. Needs Node.
[preprocessor.shiki]
command = "node tools/mdbook-shiki/index.mjs"
after = ["gallery"]
