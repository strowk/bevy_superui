[package]
name = "superui_playground_web"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
utilities = ["dep:superui_css_utilities"]

[dependencies]
superui = { path = "../superui", version = "0.3.5", features = ["transpiler", "hmr"] }
superui_css = { path = "../superui_css", version = "0.3.5" }
superui_css_utilities = { path = "../superui_css_utilities", version = "0.3.5", default-features = false, optional = true }
supersolid = { path = "../supersolid", version = "0.3.5" }
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_ui",
    "bevy_text",
    "bevy_picking",
    "ui_picking",
    "bevy_input_focus",
    "default_font",
    "bevy_ui_widgets",
    "system_clipboard",
] }
serde_json = "1"

# superui_bridge's `engine-v8`/`engine-web` features are mutually exclusive (see
# superui_js's feature guard); select per-target the same way superui/Cargo.toml does,
# so this crate's own wasm build doesn't pull both engines in via default features.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
superui_bridge = { path = "../superui_bridge", version = "0.3.5", default-features = false, features = ["engine-v8"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
superui_bridge = { path = "../superui_bridge", version = "0.3.5", default-features = false, features = ["engine-web"] }
wasm-bindgen = "0.2"

[dev-dependencies]
# native integration harness mirrors crates/superui/tests/support
superui_html = { path = "../superui_html", version = "0.3.5" }
superui_dom = { path = "../superui_dom", version = "0.3.5" }
