[package]
name = "superui_bridge"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "DOM-to-ECS reconciler and JS/Bevy bridge for bevy_superui"
repository.workspace = true
keywords = ["bevy", "ui", "dom", "javascript", "gamedev"]
categories = ["game-development"]

[dependencies]
superui_dom = { path = "../superui_dom", version = "0.2.3" }
superui_js = { path = "../superui_js", version = "0.2.3" }
superui_api = { path = "../superui_api", version = "0.2.3" }
superui_css = { path = "../superui_css", version = "0.2.3" }
supersolid_runtime = { path = "../supersolid_runtime", version = "0.2.3" }
boa_engine.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy, headless subset. Only the ECS/app/ui/picking/input pieces the bridge needs.
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_ui",
    "bevy_text",
    "bevy_picking",
    "ui_picking",
    "bevy_input_focus",
    "default_font",
] }

# Boa pulls getrandom 0.3, which needs the JS backend on wasm (same gotcha as the
# JS crates). Pair with the repo-root `.cargo/config.toml` rustflag.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
superui_html = { path = "../superui_html" }
