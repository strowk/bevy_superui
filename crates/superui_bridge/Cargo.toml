[package]
name = "superui_bridge"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "DOM-to-ECS reconciler and JS/Bevy bridge for bevy_superui"
repository.workspace = true
keywords = ["bevy", "ui", "dom", "javascript", "gamedev"]
categories = ["game-development"]

[dependencies]
superui_dom = { path = "../superui_dom", version = "0.3.3" }
superui_js = { path = "../superui_js", version = "0.3.3", default-features = false }
superui_css = { path = "../superui_css", version = "0.3.3" }
supersolid_runtime = { path = "../supersolid_runtime", version = "0.3.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy, headless subset. Only the ECS/app/ui/picking/input pieces the bridge needs.
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_ui",
    "bevy_text",
    "bevy_picking",
    "ui_picking",
    "bevy_input_focus",
    "default_font",
] }

[dev-dependencies]
superui_html = { path = "../superui_html" }

[features]
default = ["engine-boa"]
engine-boa = ["superui_js/engine-boa", "supersolid_runtime/engine-boa"]
engine-v8 = ["superui_js/engine-v8", "supersolid_runtime/engine-v8"]
engine-web = ["superui_js/engine-web", "supersolid_runtime/engine-web"]
