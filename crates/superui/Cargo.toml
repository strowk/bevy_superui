[package]
name = "superui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Browser-like HTML/CSS/JS + Solid-style TSX UI for Bevy"
repository.workspace = true
keywords = ["bevy", "ui", "html", "css", "gamedev"]
categories = ["game-development"]

[dependencies]
superui_dom = { path = "../superui_dom", version = "0.1.2" }
superui_html = { path = "../superui_html", version = "0.1.2" }
superui_js = { path = "../superui_js", version = "0.1.2" }
superui_api = { path = "../superui_api", version = "0.1.2" }
superui_css = { path = "../superui_css", version = "0.1.2" }
superui_bridge = { path = "../superui_bridge", version = "0.1.2" }
superui_paths = { path = "../superui_paths", version = "0.1.2" }

bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_ui",
    "bevy_text",
    "bevy_picking",
    "bevy_ui_picking_backend",
    "bevy_input_focus",
    "default_font",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
supersolid = { path = "../supersolid", version = "0.1.2" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
# State-preserving hot reload (Plan 5). Enable ALONGSIDE `bevy/file_watcher`.
# When on, HMR still only activates while the AssetServer is watching for changes.
hmr = []

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
