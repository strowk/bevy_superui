[package]
name = "superui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Browser-like HTML/CSS/JS + Solid-style TSX UI for Bevy"
repository.workspace = true
keywords = ["bevy", "ui", "html", "css", "gamedev"]
categories = ["game-development"]

[dependencies]
superui_dom = { path = "../superui_dom", version = "0.3.2" }
superui_html = { path = "../superui_html", version = "0.3.2" }
superui_js = { path = "../superui_js", version = "0.3.2" }
superui_api = { path = "../superui_api", version = "0.3.2" }
superui_css = { path = "../superui_css", version = "0.3.2" }
superui_bridge = { path = "../superui_bridge", version = "0.3.2" }
superui_paths = { path = "../superui_paths", version = "0.3.2" }

bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_ui",
    "bevy_text",
    "bevy_picking",
    "ui_picking",
    "bevy_input_focus",
    "default_font",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
supersolid = { path = "../supersolid", version = "0.3.2" }
# Opt-in (`utilities` feature) class-utilities stylesheet generator. Native-only
# and optional — never enters the wasm binary and adds zero deps unless enabled.
superui_css_utilities = { path = "../superui_css_utilities", version = "0.3.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
# State-preserving hot reload (Plan 5). Enable ALONGSIDE `bevy/file_watcher`.
# When on, HMR still only activates while the AssetServer is watching for changes.
hmr = []

# Opt-in class-utilities: a native-only, watch-gated system that regenerates
# `<ui>/.superui/build/utilities.generated.css` from the app's `.tsx`/`.ts`
# sources when they change, logging dropped-class diagnostics via `warn!`.
utilities = ["dep:superui_css_utilities"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
