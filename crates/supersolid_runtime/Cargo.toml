[package]
name = "supersolid_runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Solid-like reactive runtime (signals/effects/context) for bevy_superui"
repository.workspace = true
keywords = ["bevy", "ui", "reactive", "signals", "gamedev"]
categories = ["game-development"]

[dependencies]
superui_js = { path = "../superui_js", version = "0.3.3", default-features = false }

[dev-dependencies]
superui_dom = { path = "../superui_dom" }
serde_json = "1"

[features]
default = ["engine-boa"]
engine-boa = ["superui_js/engine-boa"]
engine-v8 = ["superui_js/engine-v8"]
engine-web = ["superui_js/engine-web"]
