[package]
name = "superui_test_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Playwright-shaped E2E test framework for superui apps"
repository.workspace = true
keywords = ["bevy", "superui", "testing", "e2e"]

[features]
# Expose the `--ui` runner over BRP so bevy_brp_mcp can inspect/screenshot it.
mcp_debug = ["dep:bevy_brp_extras", "bevy/bevy_remote"]

[dependencies]
bevy = { workspace = true, default-features = true }
bevy_egui = "0.39"
bevy_brp_extras = { version = "0.19", optional = true }
superui = { path = "../superui", version = "0.2.0" }
superui_bridge = { path = "../superui_bridge", version = "0.2.0" }
superui_dom = { path = "../superui_dom", version = "0.2.0" }
superui_css = { path = "../superui_css", version = "0.2.0" }
supersolid = { path = "../supersolid", version = "0.2.0" }
superui_js = { path = "../superui_js", version = "0.2.0" }
boa_engine = { workspace = true }
boa_gc = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
toml = "0.8"

[[bin]]
name = "superui_test"
path = "src/bin/superui_test.rs"
