[package]
name = "cargo-superui"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
name = "superui_cli"
path = "src/lib.rs"

[[bin]]
name = "cargo-superui"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
