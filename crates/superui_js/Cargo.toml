[package]
name = "superui_js"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "JS engine boundary and Boa backend for bevy_superui"
repository.workspace = true
keywords = ["bevy", "ui", "javascript", "boa", "gamedev"]
categories = ["game-development"]

[dependencies]
superui_dom = { path = "../superui_dom", version = "0.3.3" }
boa_engine.workspace = true
boa_gc.workspace = true

# wasm-only. `getrandom`: Boa pulls getrandom 0.3, which needs the JS backend on
# wasm (pair with the `.cargo/config.toml` rustflag at the repo root).
# `web-time`: wall clock for Boa's `Date`; the default `StdClock`
# (`std::time::SystemTime::now`) panics on wasm. Native keeps `StdClock` and pulls
# neither of these.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time = "1"
