[package]
name = "superui_js"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "JS engine boundary and Boa backend for bevy_superui"
repository.workspace = true
keywords = ["bevy", "ui", "javascript", "boa", "gamedev"]
categories = ["game-development"]

[dependencies]
superui_dom = { path = "../superui_dom", version = "0.3.3" }
boa_engine = { workspace = true, optional = true }
boa_gc = { workspace = true, optional = true }
serde_json = "1"

[dev-dependencies]
superui_html = { path = "../superui_html", version = "0.3.3" }

# wasm-only. `getrandom`/`web-time` back the `engine-boa` backend (see below);
# `wasm-bindgen`/`js-sys` back `engine-web`, the adapter that runs the JS bundle
# in the BROWSER's own engine and calls into it over the wasm boundary. All are
# optional and pulled only by their engine feature. Native builds pull none.
# `getrandom`: Boa pulls getrandom 0.3, which needs the JS backend on wasm (pair
# with the `.cargo/config.toml` rustflag at the repo root). `web-time`: wall
# clock for Boa's `Date`; the default `StdClock` (`std::time::SystemTime::now`)
# panics on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
web-time = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

# native-only, and only pulled by the `engine-v8` backend. deno_core embeds V8
# (via a prebuilt rusty_v8 static lib downloaded on first build) and is not
# available on wasm — hence the target gate on top of the `dep:` feature gate.
# `tokio`: deno_core's V8 platform posts delayed tasks (e.g. idle GC) that panic
# unless a tokio runtime context is entered; V8Engine owns one and enters it
# around all v8 work so every engine-v8 consumer gets this for free.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
deno_core = { version = "0.412", optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[features]
# Boa is the only engine with a real adapter today; v8/web are declared so the
# feature surface (and dependents' manifests) is stable ahead of their adapters
# landing, but selecting them fails at compile time (see src/lib.rs guards).
default = ["engine-boa"]
engine-boa = ["dep:boa_engine", "dep:boa_gc", "dep:getrandom", "dep:web-time"]
engine-v8 = ["dep:deno_core", "dep:tokio"]
# Runs the JS in the browser's engine (no embedded interpreter); the wasm module
# calls into it via wasm-bindgen/js-sys. wasm-only (guarded in src/lib.rs).
engine-web = ["dep:wasm-bindgen", "dep:js-sys"]
