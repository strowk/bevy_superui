[package]
# NOTE: named `chest_inventory`, not `inventory` — the directory is
# `examples/inventory` (per the task spec), but a package literally named
# `inventory` collides with the `inventory` crate already in this workspace's
# dependency graph (pulled in transitively via `bevy_reflect`), making
# `cargo build/test -p inventory` ambiguous between two `inventory@0.4.0`-ish
# package IDs. `chest_inventory` is unambiguous; use `-p chest_inventory`.
name = "chest_inventory"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
# Native state-preserving hot reload: live `.tsx` via TsxLoader + the asset watcher.
# `cargo run -p inventory --features hmr`.
hmr = ["superui/hmr", "bevy/file_watcher"]

[dependencies]
superui = { path = "../../crates/superui" }
superui_css = { path = "../../crates/superui_css" }
bevy = { workspace = true, default-features = true }

# Host-only: pre-transpile app.tsx -> app.generated.js for wasm / no-HMR native.
[build-dependencies]
supersolid = { path = "../../crates/supersolid" }

[dev-dependencies]
# Drives the chest<->inventory drag E2E spec through the real Playwright-shaped
# test engine (`page.locator(...).dragTo(...)`), mounting the actual authored
# assets below.
superui_test_engine = { path = "../../crates/superui_test_engine" }

# `rand`/bevy's wasm entropy backend; `webgl2` selects the broadly-compatible
# WebGL2 wgpu backend for the web build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
bevy = { workspace = true, features = ["webgl2"] }
