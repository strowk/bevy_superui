[package]
name = "horde"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["ui-native"]
ui-native = []
# debug-ui enables the Bevy FPS debug overlay (top-left corner) + verbose diagnostics.
debug-ui = ["bevy/bevy_dev_tools"]
mcp_debug = ["dep:bevy_brp_extras", "bevy/bevy_remote"]

[dependencies]
bevy = { version = "0.17", features = ["file_watcher"] }

[dependencies.bevy_brp_extras]
optional = true
version = "0.17.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
