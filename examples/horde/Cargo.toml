[package]
name = "horde"
version = "0.3.3"
edition = "2021"
publish = false
# With the extra `horde-bench` bin, `cargo run -p horde` is otherwise ambiguous.
default-run = "horde"

[lib]
name = "horde"
path = "src/lib.rs"

[[bin]]
name = "horde"
path = "src/main.rs"

[[bin]]
name = "horde-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[features]
default = ["debug-ui", "engine-boa"]
ui-native = []
# Native state-preserving hot reload: live app.tsx via TsxLoader + the asset watcher.
hmr = ["superui/hmr", "bevy/file_watcher"]
debug-ui = ["bevy/bevy_dev_tools"]
mcp_debug = ["dep:bevy_brp_extras", "bevy/bevy_remote"]
bench = []
dhat-prof = ["dep:dhat", "superui_bench_support/dhat-prof"]
# JS engine selection: forward to every engine-carrying dependency. Exactly one must be active.
engine-boa = ["superui/engine-boa", "superui_bridge/engine-boa"]
engine-v8 = ["superui/engine-v8", "superui_bridge/engine-v8"]
engine-web = ["superui/engine-web", "superui_bridge/engine-web"]

[dependencies]
bevy = { workspace = true, default-features = true }
superui = { path = "../../crates/superui", default-features = false }
superui_css = { path = "../../crates/superui_css" }
superui_bridge = { path = "../../crates/superui_bridge", default-features = false }
superui_bench_support = { path = "../../crates/superui_bench_support" }
serde = { version = "1", features = ["derive"] }

[dependencies.dhat]
optional = true
version = "0.3"

[dependencies.bevy_brp_extras]
optional = true
version = "0.22.1"

# Host-only: pre-transpile app.tsx -> app.generated.js for wasm / no-HMR native.
[build-dependencies]
supersolid = { path = "../../crates/supersolid" }

[dev-dependencies]
superui_dom = { path = "../../crates/superui_dom" }
superui_html = { path = "../../crates/superui_html" }

# file_watcher (hot-reload) is native-only; wasm build drops it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["file_watcher"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
bevy = { workspace = true, features = ["webgl2"] }
