[package]
name = "bestiary"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bestiary"
path = "src/main.rs"

[features]
# Native state-preserving hot reload: live `.tsx` via TsxLoader + the asset watcher.
# `cargo run -p bestiary --features hmr`.
hmr = ["superui/hmr", "bevy/file_watcher"]

[dependencies]
superui = { path = "../../crates/superui" }
superui_css = { path = "../../crates/superui_css" }
bevy = { workspace = true, default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Host-only: pre-transpile app.tsx -> app.generated.js for wasm / no-HMR native.
[build-dependencies]
supersolid = { path = "../../crates/supersolid" }

# `rand`/bevy's wasm entropy backend; `webgl2` selects the broadly-compatible
# WebGL2 wgpu backend for the web build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
bevy = { workspace = true, features = ["webgl2"] }
