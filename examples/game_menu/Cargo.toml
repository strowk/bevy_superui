[package]
name = "game_menu"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
default = ["engine-boa"]
# Native state-preserving hot reload: live `.tsx` via TsxLoader + the asset watcher.
# `cargo run -p game_menu --features hmr`.
hmr = ["superui/hmr", "bevy/file_watcher"]
debug-ui = ["bevy/bevy_dev_tools"]
# Bevy Remote Protocol + BRP extras so bevy_brp_mcp can drive/screenshot the app.
mcp_debug = ["dep:bevy_brp_extras", "bevy/bevy_remote"]
# JS engine selection: forward to superui (which forwards to superui_js/superui_bridge).
# Exactly one must be active. Native V8: `--no-default-features --features engine-v8`.
engine-boa = ["superui/engine-boa"]
engine-v8 = ["superui/engine-v8"]
engine-web = ["superui/engine-web"]

[dependencies]
superui = { path = "../../crates/superui", default-features = false }
superui_css = { path = "../../crates/superui_css" }
bevy = { workspace = true, default-features = true }

[dependencies.bevy_brp_extras]
optional = true
version = "0.22.1"

# Host-only: pre-transpile app.tsx -> app.generated.js for wasm / no-HMR native.
[build-dependencies]
supersolid = { path = "../../crates/supersolid" }

# Boa (via superui) needs the JS getrandom backend on wasm; `webgl2` selects the
# WebGL2 wgpu backend for the web build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
bevy = { workspace = true, features = ["webgl2"] }
