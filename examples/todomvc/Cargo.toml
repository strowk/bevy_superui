[package]
name = "todomvc"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
# Opt-in diagnostics: logs every rendered text + color and each click/key press.
# Run with `cargo run -p todomvc --features debug-ui`.
debug-ui = []
# Bevy Remote Protocol + BRP extras (screenshots, send_keys) so the bevy_brp_mcp
# server can drive/inspect the running app. Run with `--features mcp_debug`.
mcp_debug = ["dep:bevy_brp_extras", "bevy/bevy_remote"]

[dependencies]
superui = { path = "../../crates/superui" }
superui_css = { path = "../../crates/superui_css" }
# Already pulled transitively via `superui`; named directly so `main.rs` can use
# its types for the mcp_debug click injector.
superui_bridge = { path = "../../crates/superui_bridge" }
# Full Bevy (windowing + rendering) — this is the runnable app, not a headless lib.
bevy = { workspace = true, default-features = true }
serde = { version = "1", features = ["derive"] }

# Native only: file watching drives hot reload (design §6). The `notify` crate
# behind `file_watcher` does not build on wasm — this is why hot reload is native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["file_watcher"] }

[dependencies.bevy_brp_extras]
optional = true
version = "0.17.3"

[dev-dependencies]
# Headless integration tests reuse the browser stack without a window.
superui_dom = { path = "../../crates/superui_dom" }
superui_html = { path = "../../crates/superui_html" }

# Boa (pulled transitively via superui) needs the JS getrandom backend on wasm;
# `webgl2` selects the broadly-compatible WebGL2 wgpu backend for the web build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
bevy = { workspace = true, features = ["webgl2"] }
