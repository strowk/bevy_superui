[package]
name = "counter"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
# Native state-preserving hot reload: live `.tsx` via TsxLoader + the asset watcher.
# `cargo run -p counter --features hmr`.
hmr = ["superui/hmr", "bevy/file_watcher"]

# Web playground: transpile TSX in-browser + live edit via the bridge crate.
# NOTE: deliberately does NOT pull bevy/file_watcher (no watcher on wasm); the
# app sets watch_for_changes_override itself (see main.rs).
playground = ["superui/transpiler", "superui/hmr", "dep:superui_playground_web", "superui_playground_web/utilities"]

[dependencies]
superui = { path = "../../crates/superui" }
superui_css = { path = "../../crates/superui_css" }
superui_playground_web = { path = "../../crates/superui_playground_web", version = "0.3.5", optional = true }
bevy = { workspace = true, default-features = true }

# Host-only: pre-transpile app.tsx -> app.generated.js for wasm / no-HMR native.
[build-dependencies]
supersolid = { path = "../../crates/supersolid" }

# `rand`/bevy's wasm entropy backend; `webgl2` selects the broadly-compatible
# WebGL2 wgpu backend for the web build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
bevy = { workspace = true, features = ["webgl2"] }
