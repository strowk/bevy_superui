<!doctype html><html><head><meta charset="utf-8"><title>superui playground proof</title></head>
<body>
  <canvas id="superui-canvas" width="480" height="320"></canvas>
  <div><textarea id="tsx" rows="16" cols="60"></textarea><textarea id="css" rows="16" cols="40"></textarea></div>
  <button id="run">Run</button>
  <pre id="diag"></pre>
  <script type="module">
    import init, { apply_source, apply_utilities, poll_diagnostics } from "./counter.js";
    await init();
    const tsx = document.getElementById("tsx");
    const css = document.getElementById("css");
    tsx.value = await (await fetch("assets/ui/counter/app.tsx")).text();
    css.value = await (await fetch("assets/ui/counter/style.css")).text();
    function runAll() {
      const d = document.getElementById("diag");
      // Seed authored CSS + regenerate utilities from the current .tsx, then re-exec.
      const out1 = apply_source("style.css", css.value);
      const out2 = apply_utilities(JSON.stringify([tsx.value]));
      const out3 = apply_source("app.tsx", tsx.value);
      d.textContent = [out1, out2, out3].join("\n");
    }
    document.getElementById("run").onclick = runAll;
    runAll(); // initial seed, so first paint isn't authored-CSS-only.
    setInterval(() => {
      const p = poll_diagnostics();
      if (p && p !== "[]") document.getElementById("diag").textContent += "\n" + p;
    }, 500);
  </script>
</body></html>
