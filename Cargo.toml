[workspace]
resolver = "2"
members = ["crates/*", "examples/*", "xtask", "tools/mdbook-gallery"]

[workspace.package]
edition = "2021"
version = "0.2.3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/strowk/bevy_superui"

[workspace.dependencies]
slotmap = "1.0"
html5ever = "0.39"
boa_engine = { package = "superui_boa_engine", version = "0.2.3", path = "crates/superui_boa_engine" }
boa_gc = "0.21"
oxc = { version = "0.140", features = ["semantic", "transformer", "codegen", "ast_visit"] }
bevy = { version = "0.18", default-features = false }
bevy_app = "0.18"
bevy_asset = "0.18"
bevy_camera = "0.18"
bevy_color = "0.18"
bevy_ecs = "0.18"
bevy_image = "0.18"
bevy_input_focus = "0.18"
bevy_math = "0.18"
bevy_picking = "0.18"
bevy_reflect = "0.18"
bevy_scene = "0.18"
bevy_text = "0.18"
bevy_time = "0.18"
bevy_ui = "0.18"
bevy_utils = "0.18"
bevy_window = "0.18"
