[workspace]
resolver = "2"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
slotmap = "1.0"
html5ever = "0.39"
boa_engine = "0.21"
boa_gc = "0.21"
oxc = { version = "0.140", features = ["semantic", "transformer", "codegen", "ast_visit"] }
