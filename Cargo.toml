[workspace]
resolver = "2"
members = ["crates/*", "examples/*", "xtask", "tools/mdbook-gallery"]

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/strowk/bevy_superui"

[workspace.dependencies]
slotmap = "1.0"
html5ever = "0.39"
oxc = { version = "0.140", features = ["semantic", "transformer", "codegen", "ast_visit"] }
bevy = { version = "0.20", default-features = false }
bevy_app = "0.20"
bevy_asset = "0.20"
bevy_camera = "0.20"
bevy_color = "0.20"
bevy_curve = "0.20"
bevy_ecs = "0.20"
bevy_image = "0.20"
bevy_input_focus = "0.20"
bevy_math = "0.20"
bevy_picking = "0.20"
bevy_reflect = "0.20"
bevy_text = "0.20"
bevy_time = "0.20"
bevy_ui = "0.20"
bevy_ui_widgets = "0.20"
bevy_utils = "0.20"
bevy_window = "0.20"
