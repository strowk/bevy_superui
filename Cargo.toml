[workspace]
resolver = "2"
members = ["crates/*", "examples/*", "xtask", "tools/mdbook-gallery"]

[workspace.package]
edition = "2021"
version = "0.3.7"
license = "MIT OR Apache-2.0"
repository = "https://github.com/strowk/bevy_superui"

[workspace.dependencies]
slotmap = "1.0"
html5ever = "0.39"
oxc = { version = "0.140", features = ["semantic", "transformer", "codegen", "ast_visit"] }
bevy = { version = "0.19", default-features = false }
bevy_app = "0.19"
bevy_asset = "0.19"
bevy_camera = "0.19"
bevy_color = "0.19"
bevy_ecs = "0.19"
bevy_image = "0.19"
bevy_input_focus = "0.19"
bevy_math = "0.19"
bevy_picking = "0.19"
bevy_reflect = "0.19"
bevy_text = "0.19"
bevy_time = "0.19"
bevy_ui = "0.19"
bevy_utils = "0.19"
bevy_window = "0.19"

# Bevy debug binaries carry enormous debuginfo; linking the test binaries (full
# Bevy + egui) can exhaust the Windows linker and fail with `os error 1453`
# (ERROR_NO_SYSTEM_RESOURCES), especially when `cargo test --workspace` links many
# in parallel. line-tables-only keeps usable backtraces while dropping most of
# that debuginfo, cutting linker memory enough to link. Applies to test builds too
# (the test profile inherits dev).
[profile.dev]
debug = "line-tables-only"
