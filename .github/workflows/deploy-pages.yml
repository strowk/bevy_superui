name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          matrix=$(jq -c '{include: .examples | map({slug, package, build_args: (.build_args // "")})}' examples/gallery.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-${{ matrix.slug }}

      - name: Resolve dependencies and derive wasm-bindgen version
        run: |
          cargo metadata --format-version=1 --quiet > metadata.json
          mapfile -t WB_VERSIONS < <(jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' metadata.json | sort -u)
          if [ "${#WB_VERSIONS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wasm-bindgen version, found: ${WB_VERSIONS[*]}"
            exit 1
          fi
          WB="${WB_VERSIONS[0]}"
          echo "Using wasm-bindgen $WB"
          echo "WB_VERSION=$WB" >> "$GITHUB_ENV"

      - name: Install wasm-bindgen-cli (exact match)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WB_VERSION }}

      # Pin binaryen from GitHub releases. Ubuntu's apt binaryen is v108, which is
      # too old to preserve wasm-bindgen's reference-types externref table even
      # with --enable-reference-types — the module then fails `Table.grow` at load.
      # v119 handles it (verified locally). taiki-e/install-action has no binaryen
      # tool and the crates.io `binaryen` crate ships no wasm-opt, so download it.
      - name: Install binaryen (wasm-opt)
        run: |
          BINARYEN=version_119
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-${BINARYEN}/bin" >> "$GITHUB_PATH"

      - name: Build wasm (release, WebGL2)
        run: cargo build -p ${{ matrix.package }} --release --target wasm32-unknown-unknown ${{ matrix.build_args }}

      - name: wasm-bindgen
        run: |
          wasm-bindgen --no-typescript --target web \
            --out-dir "stage/${{ matrix.slug }}" --out-name "${{ matrix.slug }}" \
            "target/wasm32-unknown-unknown/release/${{ matrix.package }}.wasm"

      # --enable-reference-types is REQUIRED: wasm-bindgen emits an externref
      # table, and without this flag wasm-opt caps it so the init-time
      # `Table.grow` fails at load ("WebAssembly.Table.grow(): failed to grow
      # table by 4"). --enable-bulk-memory keeps memory.copy/fill intact.
      - name: wasm-opt
        run: |
          wasm-opt -Oz --enable-reference-types --enable-bulk-memory \
            -o "stage/${{ matrix.slug }}/${{ matrix.slug }}_bg.wasm" \
            "stage/${{ matrix.slug }}/${{ matrix.slug }}_bg.wasm"

      - name: Generate host page
        run: cargo run -p xtask -- host-page --slug ${{ matrix.slug }} --out "stage/${{ matrix.slug }}"

      - name: Copy app assets (after build so app.generated.js exists)
        run: cp -r "examples/${{ matrix.slug }}/assets" "stage/${{ matrix.slug }}/assets"

      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.slug }}
          path: stage/${{ matrix.slug }}

  assemble-and-deploy:
    needs: [discover, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build the site (landing + docs + gallery index)
        run: mdbook build website --dest-dir "$GITHUB_WORKSPACE/dist"

      - name: Download example artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: example-*

      - name: Overlay demos under dist/examples/
        run: |
          mkdir -p dist/examples
          cp -r tools/gallery/vendor dist/examples/vendor
          for d in downloaded/example-*; do
            slug="${d#downloaded/example-}"
            rm -rf "dist/examples/$slug"
            mv "$d" "dist/examples/$slug"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
